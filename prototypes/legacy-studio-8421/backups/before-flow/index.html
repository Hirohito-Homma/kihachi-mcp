<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>KIHACHI MUSIC AI — Studio</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#101512;color:#eef3e8;font:16px/1.7 system-ui,sans-serif}main{max-width:1080px;margin:auto;padding:48px 24px}header{display:flex;justify-content:space-between;gap:20px;align-items:center}.eyebrow{color:#b7e576;letter-spacing:.18em;font-size:12px}h1{font-size:36px;line-height:1.2;margin:8px 0}h2{font-size:20px}p{color:#aab6aa}.grid{display:grid;grid-template-columns:1.2fr 1fr;gap:24px;margin-top:30px}.panel{background:#1a231d;border:1px solid #344237;border-radius:20px;padding:28px}textarea,input{width:100%;background:#101712;color:#fff;border:1px solid #556652;border-radius:10px;padding:14px;font:inherit}textarea{min-height:180px;resize:vertical}button,a{font:inherit}button{border:0;border-radius:10px;padding:12px 18px;background:#c0ec87;color:#14200e;cursor:pointer;margin:8px 8px 8px 0}button:disabled{opacity:.4;cursor:wait}.secondary{background:#354536;color:#eef3e8}.seed{width:110px}a{color:#c0ec87;margin-right:16px}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:13px;max-height:350px;overflow:auto}.status{font-size:13px;color:#c0ec87}#message{white-space:pre-wrap;color:#efce92}label{display:block;margin:12px 0 6px}.muted{font-size:13px;color:#aab6aa}@media(max-width:760px){.grid{grid-template-columns:1fr}header{display:block}h1{font-size:28px}}
</style><main><header><div><div class="eyebrow">YOUR WORDS. YOUR MUSIC.</div><h1>KIHACHI MUSIC AI</h1><p>作りたい音を、言葉からLiveへ。</p></div><div><div id="connection" class="status">Liveを確認中…</div><button class="secondary" id="refresh">接続を確認</button></div></header>
<div class="grid"><section class="panel"><h2>01 / 曲を指定する</h2><label for="prompt">ジャンル・テンポ・雰囲気・長さ</label><textarea id="prompt" maxlength="2000" placeholder="例：DubとTech House。110 BPM、D#m、32小節。太いベース、余白のあるドラム。"></textarea><button class="secondary" id="example">例を入れる</button><label for="seed">バリエーション番号</label><input id="seed" class="seed" type="number" value="8" min="0" max="999999"><p class="muted">同じ指定と番号で再現できます。生成結果は曲ごとのフォルダに保存します。</p><button id="compose">曲を生成する</button><p class="muted">MIDI作曲モード：Liveの音源で演奏します。歌声・AI音声レンダリングは含みません。</p></section>
<section class="panel"><h2>02 / 確認してLiveへ</h2><div id="result"><p>生成後にテンポ・長さ・パートを表示します。</p></div><div id="downloads"></div><button id="prepare" disabled>Liveへの追加内容を確認</button><div id="plan"></div><button id="apply" disabled>この内容でLiveに追加</button><p class="muted">新しいトラックを追加し、Live全体のテンポを変更します。再生はLiveで開始してください。</p></section></div><p id="message" role="status" aria-live="polite"></p><details><summary>実行記録</summary><pre id="log"></pre></details></main>
<script>
const $=id=>document.getElementById(id);let song=null;const token='__TOKEN__';
async function api(path,data){const r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json','X-Studio-Token':token},body:JSON.stringify(data)});const d=await r.json();if(!r.ok)throw Error(d.error);return d}
async function status(){try{const d=await(await fetch('/api/status')).json();$('connection').textContent=d.connected?`Live接続済み · ${d.live.tempo} BPM · ${d.live.tracks.length}トラック`:'Live未接続：LiveのControl SurfaceでAbletonGPTを選択';}catch(e){$('connection').textContent='Studioに接続できません'}}
async function busy(fn){const buttons=[...document.querySelectorAll('button')];const old=buttons.map(b=>b.disabled);buttons.forEach(b=>b.disabled=true);$('message').textContent='処理中です。Liveへの追加には数分かかる場合があります。';try{await fn();}catch(e){$('message').textContent=e.message;}finally{buttons.forEach((b,i)=>b.disabled=old[i]);$('prepare').disabled=!song;$('apply').disabled=!song?.prepared;}}
$('example').onclick=()=>{$('prompt').value='DubとTech House。110 BPM、D#m、32小節。太いベース、余白のあるドラム。'};
$('refresh').onclick=status;
$('compose').onclick=()=>busy(async()=>{song=null;$('plan').textContent='';$('downloads').replaceChildren();const d=await api('/api/compose',{prompt:$('prompt').value,seed:Number($('seed').value)});song=d;const s=d.spec.song;$('result').textContent=`${s.bpm} BPM / ${s.key} / ${s.total_bars}小節 / 約${Math.round(s.target_duration_sec)}秒`;$('log').textContent=JSON.stringify(d.spec,null,2);for(const f of d.files.filter(f=>f.endsWith('.mid'))){const a=document.createElement('a');a.href=`/files/${d.id}/${f}`;a.download=f;a.textContent=f;$('downloads').append(a)}$('message').textContent='曲を保存しました。次にLiveへの追加内容を確認できます。'});
$('prepare').onclick=()=>busy(async()=>{song.prepared=false;const d=await api('/api/prepare',{id:song.id});$('plan').textContent=`テンポ ${d.current_tempo} → ${d.plan.song.bpm} BPM。追加：${d.plan.tracks.map(t=>t.name).join('、')}`;song.prepared=true;$('message').textContent='内容を確認して「この内容でLiveに追加」を押してください。'});
$('apply').onclick=()=>busy(async()=>{song.prepared=false;const d=await api('/api/apply',{id:song.id});$('log').textContent=d.log+'\n'+JSON.stringify(d.status,null,2);$('message').textContent='追加処理が終了しました。実行記録とLiveで結果を確認し、再生してください。';await status()});status();
</script></html>
