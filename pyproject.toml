[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kihachi-mcp"
version = "0.1.0"
description = "MCP server for KIHACHI MUSIC AI"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=4.0.3",
    "numpy>=2.0,<3",
    "pyyaml>=6.0.3",
    "scipy>=1.18.1",
    "soundfile>=0.14.0",
]

[project.scripts]
kihachi = "kihachi_mcp.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.11.0",
]
# MW10 gateway service (mw10_gateway/, a standalone FastAPI app living in
# this repo; not part of the kihachi_mcp wheel).
gateway = [
    "fastapi>=0.115",
    "pydantic>=2.0",
    "uvicorn>=0.30",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
pythonpath = ["src", ".", "mw10_gateway"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
src = ["src"]

[tool.hatch.build.targets.wheel]
packages = ["src/kihachi_mcp"]
exclude = ["**/*.asd"]

[tool.hatch.build.targets.wheel.force-include]
"src/kihachi_mcp/resources/genres/dub_techno.yaml" = "kihachi_mcp/resources/genres/dub_techno.yaml"
"src/kihachi_mcp/resources/genres/tech_house.yaml" = "kihachi_mcp/resources/genres/tech_house.yaml"
"src/kihachi_mcp/resources/genres/melodic_techno.yaml" = "kihachi_mcp/resources/genres/melodic_techno.yaml"
"src/kihachi_mcp/resources/genre_database.json" = "kihachi_mcp/resources/genre_database.json"
"src/kihachi_mcp/studio/static/index.html" = "kihachi_mcp/studio/static/index.html"
"src/kihachi_mcp/studio/static/references.html" = "kihachi_mcp/studio/static/references.html"
"src/kihachi_mcp/assets/drums/kihachi-kick-fat-tight.wav" = "kihachi_mcp/assets/drums/kihachi-kick-fat-tight.wav"
