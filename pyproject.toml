[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kihachi-mcp"
version = "0.1.0"
description = "MCP server for KIHACHI MUSIC AI"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=4.0.3",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.11.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
src = ["src"]
